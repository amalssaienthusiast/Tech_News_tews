services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: technews_api
    restart: unless-stopped
    command: ["uvicorn", "src.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - TECHNEWS_ENV=production
      - TECHNEWS_DB_PATH=/data/canonical_technews.db
      - TECHNEWS_LOG_LEVEL=INFO
      - TECHNEWS_ENABLE_PROMETHEUS=true
      - TECHNEWS_ADMIN_API_KEY=${TECHNEWS_ADMIN_API_KEY}
      - TECHNEWS_RW_API_KEY=${TECHNEWS_RW_API_KEY}
      - TECHNEWS_RO_API_KEY=${TECHNEWS_RO_API_KEY}
    volumes:
      - sqlite_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: technews_worker
    restart: unless-stopped
    command: ["python", "-m", "src.worker", "--concurrency", "2", "--db-path", "/data/canonical_technews.db"]
    environment:
      - TECHNEWS_ENV=production
      - TECHNEWS_DB_PATH=/data/canonical_technews.db
      - TECHNEWS_LOG_LEVEL=INFO
    volumes:
      - sqlite_data:/data
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: technews_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api

volumes:
  sqlite_data:
    driver: local
  prometheus_data:
    driver: local
